name: Secretos

# Rechaza PRs que añadan tokens, claves o ficheros de credenciales. El repositorio es público.
# Complementa el escaneo de secretos y la protección de push de GitHub (que ya están activados).

on:
  pull_request:

permissions:
  contents: read

jobs:
  escanear:
    name: Sin secretos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Escanear lo que añade el PR
        run: node scripts/escanear-secretos.mjs --base "origin/${{ github.base_ref }}"

name: Release Android (App Bundle)

# Dispara con un tag vX.Y.Z. Genera el .aab firmado y lo adjunta al Release.
# Secrets necesarios: GOOGLE_SERVICES_JSON_BASE64, ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Ver docs/RELEASE.md.

on:
  push:
    tags: ['v*.*.*']

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Falta el secret GOOGLE_SERVICES_JSON_BASE64 (ver docs/SECURITY.md)"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Restaurar keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOT
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOT

      - run: flutter pub get
      - run: flutter build appbundle --release

      - name: Adjuntar al Release de GitHub
        uses: softprops/action-gh-release@v3
        with:
          files: build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true

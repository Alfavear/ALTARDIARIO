name: Deploy Firebase (rules · indexes · hosting)

# Se despliega SOLO al hacer merge en main y SOLO si cambiaron estos archivos.
# Requiere el secret FIREBASE_SERVICE_ACCOUNT (JSON de cuenta de servicio con
# rol "Firebase Admin"). Ver docs/SECURITY.md.

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json
      - firebase.json
      - lib/**
      - web/**
      - pubspec.yaml
  workflow_dispatch:

jobs:
  rules-and-indexes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g firebase-tools
      - name: Deploy rules + indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          firebase deploy --only firestore:rules,firestore:indexes --project altardiario-ec25f --non-interactive

  hosting:
    runs-on: ubuntu-latest
    needs: [rules-and-indexes]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: altardiario-ec25f

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test (con cobertura)
        run: flutter test --no-pub --coverage

      - name: Subir cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  knowledge-graph:
    name: Grafo de conocimiento (node)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests del formato JSONL
        run: node --test scripts/tests/kg-jsonl.test.mjs

  firestore-rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar deps
        working-directory: firestore-tests
        run: npm ci || npm install
      - name: Tests de reglas (emulador)
        working-directory: firestore-tests
        run: npm test

  build-android:
    name: Build APK (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [flutter]
    steps:
      - uses: actions/checkout@v4
        with:
          # Necesario para el merge-base del filtro de rutas.
          fetch-depth: 0
      # El job se ejecuta SIEMPRE (si no, el check requerido quedaría en
      # "expected" y bloquearía el merge), pero el build solo corre cuando el
      # PR puede romper Android: android/, dependencias o los propios workflows.
      # Un PR de Dart/UI ya lo cubren analyze, tests y el build web.
      - name: ¿Hace falta compilar Android?
        id: filtro
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Fuera de PRs (push a main): se compila siempre."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
             | grep -Eq '^(android/|pubspec\.yaml$|pubspec\.lock$|\.github/workflows/)'; then
            echo "El PR toca Android, dependencias o workflows: se compila."
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "PR sin cambios de Android/dependencias/workflows: se omite el build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.filtro.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        if: steps.filtro.outputs.build == 'true'
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v4
        if: steps.filtro.outputs.build == 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - run: flutter pub get
        if: steps.filtro.outputs.build == 'true'
      - name: Crear google-services.json
        if: steps.filtro.outputs.build == 'true'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Falta el secret GOOGLE_SERVICES_JSON_BASE64 (ver docs/SECURITY.md)"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
      - name: Build APK debug
        if: steps.filtro.outputs.build == 'true'
        # Una sola ABI: el job es una prueba de humo del toolchain Android
        # (Gradle/AGP/Kotlin/manifest/plugins), no un artefacto de entrega.
        run: flutter build apk --debug --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        if: steps.filtro.outputs.build == 'true'
        with:
          name: app-debug.apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [flutter]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release

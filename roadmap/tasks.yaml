# ═══════════════════════════════════════════════════════════════════
#  Roadmap ejecutable de AltarDiario
#
#  Este archivo es la ÚNICA fuente de verdad de "qué hay que hacer".
#  Lo leen y escriben los agentes a través del MCP `altardiario-roadmap`
#  (tools/roadmap-mcp). Los humanos pueden editarlo a mano; el MCP valida.
#
#  Estados: backlog → ready → in_progress → review → done | blocked | dropped
#  Prioridad: P0 (producción rota/seguridad) P1 (esta fase) P2 (siguiente) P3 (idea)
#  Esfuerzo: S (<1 ciclo) M (1-2 ciclos) L (3+ ciclos → dividir antes de empezar)
#  Tipo: security | bug | refactor | test | feature | docs | infra | audit
# ═══════════════════════════════════════════════════════════════════

meta:
  version: 1
  current_phase: 1
  cycle_counter: 0
  phases:
    1: "Estabilizar (seguridad, observabilidad, CI)"
    2: "Andamiaje IA y tests"
    3: "Arquitectura feature-first y backend"
    4: "Producto"

tasks:
  - id: T-001
    title: Ejecutar flutter pub get y resolver conflictos de versiones de la rama de andamiaje
    type: infra
    phase: 1
    priority: P0
    effort: S
    status: ready
    acceptance:
      - "flutter pub get termina sin errores"
      - "flutter analyze no reporta errores (warnings/infos permitidos y listados en bitácora)"
    files: [pubspec.yaml]

  - id: T-002
    title: Ejecutar suite de tests de reglas de Firestore contra el emulador y corregir fallos
    type: security
    phase: 1
    priority: P0
    effort: S
    status: ready
    depends_on: []
    acceptance:
      - "scripts/rules_test.sh pasa todos los tests"
      - "ninguna escritura legítima de firestore_service.dart queda bloqueada (verificado con lista de métodos)"
    files: [firestore.rules, firestore-tests/rules.test.mjs]

  - id: T-003
    title: Arreglar tests existentes que rompan por las nuevas dependencias/lints
    type: test
    phase: 1
    priority: P0
    effort: M
    status: backlog
    depends_on: [T-001]
    acceptance:
      - "flutter test pasa al 100%"
      - "ningún test fue borrado ni marcado skip"

  - id: T-004
    title: UI de reportar contenido y bloquear usuario (App Store 1.2)
    type: feature
    phase: 1
    priority: P1
    effort: M
    status: backlog
    depends_on: [T-002, T-003]
    acceptance:
      - "menú ⋯ en reflexión/petición/debate con opción Reportar que escribe en reports/"
      - "opción Bloquear usuario en perfil público; feed filtra usuarios bloqueados (lista en usuarios/{uid}.bloqueados)"
      - "widget test de ambos flujos"
      - "contenido con hidden: true no se muestra en feed"
    files: [lib/presentation/screens/feed_screen.dart, lib/presentation/screens/public_profile_screen.dart, lib/data/services/firestore_service.dart]

  - id: T-005
    title: Tests de FirestoreService con fake_cloud_firestore (likes, reacciones, seguir, amén)
    type: test
    phase: 2
    priority: P1
    effort: M
    status: backlog
    depends_on: [T-003]
    acceptance:
      - "test/services/firestore_service_test.dart cubre toggleLike, toggleReaction, follow/unfollow, amen"
      - "cobertura de firestore_service.dart > 50%"

  - id: T-006
    title: Migrar feature oracion a lib/features/oracion/ (ADR-0001)
    type: refactor
    phase: 3
    priority: P1
    effort: M
    status: backlog
    depends_on: [T-003, T-005]
    acceptance:
      - "lib/features/oracion/{data,providers,presentation} existe con OracionRepository"
      - "oracion_screen.dart < 400 líneas"
      - "app_providers.dart exporta los providers migrados para compatibilidad"
      - "sin cambios de comportamiento (tests existentes pasan sin modificar)"

  - id: T-007
    title: Paginación real del feed con startAfterDocument e infinite scroll
    type: feature
    phase: 3
    priority: P1
    effort: M
    status: backlog
    depends_on: [T-003]
    acceptance:
      - "feed carga 30 reflexiones y pide más al llegar al final"
      - "provider con estado de página testeado"

  - id: T-008
    title: Partir perfil_screen.dart (1956 líneas) en widgets por sección
    type: refactor
    phase: 3
    priority: P2
    effort: L
    status: backlog
    depends_on: [T-003]
    acceptance:
      - "ningún archivo resultante > 400 líneas"
      - "golden/widget tests existentes pasan"

  - id: T-009
    title: Desplegar Cloud Functions de gamificación en paralelo al cliente (ADR-0002 paso 1)
    type: infra
    phase: 3
    priority: P2
    effort: M
    status: blocked
    blocked_reason: "Requiere plan Blaze y decisión humana de desplegar"
    acceptance:
      - "functions desplegadas; XP de servidor coincide con cliente en 7 días de datos"

  - id: T-010
    title: Compartir versículo como imagen (WhatsApp/Instagram)
    type: feature
    phase: 4
    priority: P2
    effort: M
    status: backlog
    acceptance:
      - "botón Compartir en lector genera PNG con versículo, referencia y marca AltarDiario"
      - "usa share_plus; funciona en Android/iOS/Web"

  - id: T-011
    title: Planes de lectura flexibles (empezar cualquier día, ponerse al día, planes de 7/21 días)
    type: feature
    phase: 4
    priority: P2
    effort: L
    status: backlog
    acceptance:
      - "modelo PlanLectura con fecha de inicio por usuario"
      - "al menos un plan temático corto además del anual"

name: altar_diario
description: "altarDiario - Tu hábito diario con Dios. Plan de lectura bíblica anual."
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^18.0.1
  url_launcher: ^6.3.2
  share_plus: ^13.3.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  http: ^1.2.1
  google_fonts: ^8.1.0
  timezone: ^0.10.1
  sqflite: ^2.4.3
  path: ^1.9.0

  # --- Firebase ---
  # ⚠️ Para actualizar Firebase, ejecuta: flutterfire configure
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0

  # --- Apple Sign-In ---
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.3

  # --- Riverpod (estado global) ---
  flutter_riverpod: ^3.3.1

  # --- Observabilidad (ver lib/core/observability) ---
  firebase_crashlytics: ^4.0.0
  firebase_analytics: ^11.0.0
  firebase_app_check: ^0.3.0

  # --- i18n (ver lib/l10n y skill i18n) ---
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.1
  flutter_launcher_icons: ^0.14.3
  image: ^4.8.0

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  remove_alpha_ios: true
  image_path: "assets/logo_app.png"
  adaptive_icon_background: "#0D47A1"
  adaptive_icon_foreground: "assets/logo_app.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/plan_lectura.json
    - assets/bible/
    - assets/bible/es_rv1960_complete.json
    - assets/dictionary/biblical_glossary.json

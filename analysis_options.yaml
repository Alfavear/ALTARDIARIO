# Análisis estático de AltarDiario.
# Base: flutter_lints. Reglas extra orientadas a mantenibilidad y a que el
# código sea predecible para humanos y agentes. Si una regla produce ruido
# masivo en código legacy, se puede desactivar aquí con justificación en el
# PR, nunca con `// ignore_for_file` repartidos por el código.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib/l10n/generated/**
    - "**/*.g.dart"
    - build/**
  errors:
    # Promover a warning lo que suele esconder bugs
    unused_import: warning
    unused_local_variable: warning
    dead_code: warning
    invalid_use_of_protected_member: error

linter:
  rules:
    # Estilo consistente
    prefer_single_quotes: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    prefer_final_fields: true
    unnecessary_this: true
    sort_child_properties_last: true
    use_key_in_widget_constructors: true
    directives_ordering: true

    # Seguridad y corrección
    avoid_print: true
    avoid_dynamic_calls: true
    avoid_catches_without_on_clauses: false   # se permite catch genérico con log
    unawaited_futures: true
    discarded_futures: false                  # demasiado ruidoso en UI; activar por feature
    cancel_subscriptions: true
    close_sinks: true
    always_declare_return_types: true
    avoid_returning_null_for_void: true
    no_duplicate_case_values: true
    throw_in_finally: true
    use_build_context_synchronously: true

    # Rendimiento Flutter
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true
    use_colored_box: true
    use_decorated_box: true
